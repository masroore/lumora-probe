services:
  orthanc:
    image: orthancteam/orthanc@sha256:a1b7fb6d1de31693949165c64b88fa35fae51fdeb9732fcef69cd75daea7ff9d
    ports:
      - "127.0.0.1:4242:4242"
    profiles: [interop]

  dcmtk:
    image: nbelakovskiatmssm/dcmtk@sha256:f66d95cad6bf0f361ddd6c46bf7c6563319b8d7bf284ad3d345b8d7ee04a2ab8
    command: ["storescp", "-aet", "DCMTK-SCP", "-od", "/tmp", "11112"]
    ports:
      - "127.0.0.1:11113:11112"
    healthcheck:
      test: ["CMD", "echoscu", "-aet", "HEALTHCHECK", "-aec", "DCMTK-SCP", "127.0.0.1", "11112"]
      interval: 1s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../fixtures/dicom/synthetic_study:/fixtures:ro
    profiles: [interop]

  dcm4che:
    image: dcm4che/dcm4che-tools@sha256:c8fbede4a6cf6047370ad21ce12fcc6be7ab013ff4996f1d032eb55239f870ed
    command: ["sleep", "infinity"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../fixtures/dicom/synthetic_study:/fixtures:ro
    profiles: [interop]

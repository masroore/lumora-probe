[project]
name = "lumora-probe-lite"
version = "0.1.0"
description = "Minimal DICOM C-STORE/C-ECHO receiver (Probe Lite) and sender (Sender Lite) for CLI use"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pydicom>=3.0,<4.0",
    "pynetdicom>=3.0,<4.0",
]

[project.scripts]
probe-lite = "probe_lite.cli:main"
probe_lite = "probe_lite.cli:main"
sender-lite = "sender_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probe_lite", "sender_lite"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "lumora-probe-lite"
version = "0.1.0"
description = "A minimal DICOM C-STORE and C-ECHO receiver for CLI use"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydicom>=3.0,<4.0",
    "pynetdicom>=3.0,<4.0",
]

[project.scripts]
probe-lite = "probe_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probe_lite"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up CPython
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check committed frontend assets
        run: npm ci && npm run build:assets && git diff --exit-code -- static assets/vendor

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Check architecture boundaries
        run: uv run lint-imports --no-cache

      - name: Check static types
        run: uv run basedpyright

      - name: Run tests with per-slice coverage
        run: >-
          uv run pytest -q
          --cov=lumora_probe.core
          --cov=lumora_probe.shared
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: Export locked dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv export --format requirements.txt --all-groups --no-emit-project --output-file audit-requirements.txt

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run pip-audit --strict -r audit-requirements.txt --no-deps --disable-pip | tee pip-audit-report.txt

      - name: Upload dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            audit-requirements.txt
            pip-audit-report.txt

  installed-smoke:
    name: installed ${{ matrix.artifact }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    fail-fast: false
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        artifact: [wheel, sdist]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build selected artifact
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --${{ matrix.artifact }} --outdir dist
      - name: Run installed production smoke
        shell: bash
        run: |
          artifact=$(python - <<'PY'
          from pathlib import Path
          import os
          files = sorted(Path("dist").glob("*.whl" if os.environ["ARTIFACT"] == "wheel" else "*.tar.gz"))
          assert len(files) == 1, files
          print(files[0])
          PY
          )
          python scripts/smoke_installed_distribution.py --artifact "$artifact"
        env:
          ARTIFACT: ${{ matrix.artifact }}
          LUMORA_SMOKE_LOG_DIR: ${{ runner.temp }}/lumora-installed-smoke-logs
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke-${{ matrix.os }}-${{ matrix.artifact }}
          path: |
            dist/*
            ${{ runner.temp }}/lumora-installed-smoke-logs/**

  interop:
    name: Scheduled DICOM interoperability suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up CPython
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Start interoperability implementations
        run: docker compose -f tests/interop/docker-compose.yml --profile interop up -d --wait dcmtk dcm4che orthanc

      - name: Run interoperability tests
        env:
          LUMORA_INTEROP: "1"
        run: uv run pytest -m interop -q

      - name: Stop interoperability implementations
        if: always()
        run: docker compose -f tests/interop/docker-compose.yml --profile interop down -v
